<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profil Identitas Mahasiswa</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Profil Identitas Mahasiswa</h1>
        <p>Informasi Identitas dan Nilai Mata Kuliah</p>
    </header>

    <main>

        <section class="card">
            <h2>Identitas Mahasiswa</h2>

            <p>
                <strong>Nama:</strong>
                <span id="nama"></span>
            </p>

            <p>
                <strong>NPM:</strong>
                <span id="npm"></span>
            </p>

            <p>
                <strong>Program Studi:</strong>
                <span id="program-studi"></span>
            </p>
        </section>


        <section class="card">
            <h2>Daftar Nilai Mata Kuliah</h2>

            <button id="tombol-nilai">
                Tampilkan Mata Kuliah Lulus
            </button>

            <ul id="daftar-nilai">
                <!-- Nilai akan ditampilkan melalui JavaScript -->
            </ul>
        </section>

    </main>


    <footer>
        <p>&copy; 2026 Aditya Abdu lrahman nggobe</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
